  # ─────────────────────────────────────────────────────────────────────
  # PLY application
  # ─────────────────────────────────────────────────────────────────────
  - name: ply
    buildsystem: simple
    build-commands:
      # Install PLY Python package
      - pip3 install --no-build-isolation --prefix=/app .
      # Desktop entry
      - install -Dm644 flatpak/io.github.ahmed.ply.desktop /app/share/applications/io.github.ahmed.ply.desktop
      # AppStream metadata
      - install -Dm644 flatpak/io.github.ahmed.ply.metainfo.xml /app/share/metainfo/io.github.ahmed.ply.metainfo.xml
      # Application icon (multiple sizes)
      - install -Dm644 music.png /app/share/icons/hicolor/512x512/apps/io.github.ahmed.ply.png
      - install -Dm644 assets/music.png /app/share/icons/hicolor/128x128/apps/io.github.ahmed.ply.png
      # Install assets
      - mkdir -p /app/share/ply/assets
      - cp -r assets/* /app/share/ply/assets/
    sources:
      - type: dir
        path: ..
