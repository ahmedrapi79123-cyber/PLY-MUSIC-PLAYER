app-id: io.github.ahmed.ply
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

build-options:
  env:
    PYTHONPATH: /usr/lib/x86_64-linux-gnu/gobject-introspection

command: ply

finish-args:
  # Display (X11 + Wayland)
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio playback
  - --socket=pulseaudio
  # MPRIS2 D-Bus ownership
  - --own-name=org.mpris.MediaPlayer2.ply
  # File access: user music directory only
  - --filesystem=xdg-music:ro
  # Allow file chooser portal to grant access to other files
  - --talk-name=org.freedesktop.portal.FileChooser
  # D-Bus session bus for MPRIS notifications
  - --talk-name=org.freedesktop.DBus

modules:
  # Tcl/Tk for Tkinter GUI support
  - name: tcl
    buildsystem: autotools
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtcl*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.13-src.tar.gz
        sha256: 43a1fae7412f61ff11de2cfd05d28cfc3a73762f354a417c62370a54e2caf066

  - name: tk
    buildsystem: autotools
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtk*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk8.6.13-src.tar.gz
        sha256: 2e65fa069a23365440a3c56c556b8673b5e32a283800d8d9b257e3f584ce0675

  # Build Python from source so Tkinter (_tkinter) module compiles against the Tcl/Tk above
  - name: python3
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --with-ensurepip=upgrade
    post-install:
      - chmod +x /app/bin/python3
    cleanup:
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.11.9/Python-3.11.9.tar.xz
        sha256: 9b1e896523fc510691126c864406d9360a3d1e986acbda59cda57b5abda45b87
 
