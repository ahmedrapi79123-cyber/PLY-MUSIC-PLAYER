app-id: io.github.ahmed.ply
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ply

finish-args:
  # Display: X11 (primary for Zorin/XFCE) + Wayland
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio playback via PulseAudio
  - --socket=pulseaudio
  # MPRIS2 D-Bus name ownership (required for media player MPRIS)
  - --own-name=org.mpris.MediaPlayer2.ply
  # Music directory access (read-only)
  - --filesystem=xdg-music:ro
  # File chooser portal (allows opening individual files)
  - --talk-name=org.freedesktop.portal.FileChooser
  # D-Bus session bus access (needed for MPRIS PropertiesChanged signals)
  - --talk-name=org.freedesktop.DBus
  # AyatanaAppIndicator3 requires talk to com.canonical.indicator and StatusNotifierWatcher
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  # ─────────────────────────────────────────────────────────────────────
  # Tcl/Tk: required so Python's _tkinter module compiles correctly.
  # We build Python from source after these so it picks up Tcl/Tk headers.
  # ─────────────────────────────────────────────────────────────────────
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-shared
      - --disable-symbols
    post-install:
      - chmod 755 /app/lib/libtcl*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
      - /share/man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.13-src.tar.gz
        sha256: 43a1fae7412f61ff11de2cfd05d28cfc3a73762f354a417c62370a54e2caf066

  - name: tk
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-shared
      - --with-tcl=/app/lib
    post-install:
      - chmod 755 /app/lib/libtk*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
      - /share/man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk8.6.13-src.tar.gz
        sha256: 2e65fa069a23365440a3c56c556b8673b5e32a283800d8d9b257e3f584ce0675

  # ─────────────────────────────────────────────────────────────────────
  # Python 3.11 built from source so _tkinter links against our Tcl/Tk.
  # The Platform SDK's Python lacks _tkinter (no X11 headers during build).
  # ─────────────────────────────────────────────────────────────────────
  - name: python3
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --with-ensurepip=upgrade
      - --enable-optimizations
    post-install:
      - chmod +x /app/bin/python3
    cleanup:
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.11.9/Python-3.11.9.tar.xz
        sha256: 9b1e896523fc510691126c864406d9360a3d1e986acbda59cda57b5abda45b87

  # ─────────────────────────────────────────────────────────────────────
  # PyCairo — Python bindings for Cairo (required by PyGObject)
  # ─────────────────────────────────────────────────────────────────────
  - name: python3-pycairo
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        path: /home/ahmed/ply/flatpak/deps/pycairo-1.25.1.tar.gz
        sha256: 7e2be4fbc3b4536f16db7a11982cbf713e75069a4d73d44fe5a49b68423f5c0c

  # ─────────────────────────────────────────────────────────────────────
  # PyGObject — Python bindings for GLib, Gio, Gst, Gtk
  # Provides: gi, Gio, GLib, Gst, Gtk (no dbus-python needed)
  # ─────────────────────────────────────────────────────────────────────
  - name: python3-pygobject
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        path: /home/ahmed/ply/flatpak/deps/pygobject-3.48.2.tar.gz
        sha256: c3c0a7afbe5b2c1c64dc0530109b4dd571085153dbedfbccb8ec7c5ad233f977

  # ─────────────────────────────────────────────────────────────────────
  # System Tray stack: libdbusmenu → libayatana-indicator → libayatana-appindicator
  # This enables `from gi.repository import AyatanaAppIndicator3`
  # ─────────────────────────────────────────────────────────────────────
 
  # intltool: required by libdbusmenu's autotools configure
  - name: intltool
    buildsystem: autotools
    sources:
      - type: archive
        path: /home/ahmed/ply/flatpak/deps/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  # libdbusmenu: D-Bus menu protocol library
  - name: libdbusmenu
    buildsystem: simple

    build-options:
      env:
        CFLAGS: '-Wno-error'
        HAVE_VALGRIND_TRUE: '#'
        HAVE_VALGRIND_FALSE: ''
        HAVE_VALAC: 'no'
        PYTHONPATH: '/usr/lib/x86_64-linux-gnu/gobject-introspection'

    build-commands:
      - |
        mkdir -p /app/bin
        cat > /app/bin/g-ir-scanner <<'EOF'
        #!/bin/sh
        export PYTHONPATH=/usr/lib/x86_64-linux-gnu/gobject-introspection${PYTHONPATH:+:$PYTHONPATH}
        exec /usr/bin/python3.12 /usr/bin/g-ir-scanner "$@"
        EOF
        chmod +x /app/bin/g-ir-scanner

      - |
        mkdir -p /app/lib/pkgconfig
        cp /usr/lib/x86_64-linux-gnu/pkgconfig/gobject-introspection-1.0.pc /app/lib/pkgconfig/
        sed -i 's|^g_ir_scanner=.*|g_ir_scanner=/app/bin/g-ir-scanner|' /app/lib/pkgconfig/gobject-introspection-1.0.pc

      - |
        export PKG_CONFIG_PATH=/app/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
        export PYTHONPATH=/usr/lib/x86_64-linux-gnu/gobject-introspection

        echo "Scanner:"
        pkg-config --variable=g_ir_scanner gobject-introspection-1.0

        echo "Testing gobject-introspection:"
        /usr/bin/python3.12 -c "
        import giscanner
        from giscanner._giscanner import SourceScanner
        print('giscanner Python 3.12: OK')
        print(SourceScanner)
        "

        echo "Testing g-ir-scanner:"
        /app/bin/g-ir-scanner --version

      - |
        export PKG_CONFIG_PATH=/app/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
        export PYTHONPATH=/usr/lib/x86_64-linux-gnu/gobject-introspection

        ./configure \
          --prefix=/app \
          --libdir=/app/lib \
          --with-gtk=3 \
          --disable-dumper \
          --disable-tests \
          --disable-gtk-doc \
          --disable-scrollkeeper \
          --disable-valgrind \
          --disable-nls \
          --disable-vala

      - |
        export PKG_CONFIG_PATH=/app/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
        export PYTHONPATH=/usr/lib/x86_64-linux-gnu/gobject-introspection

        make -j$FLATPAK_BUILDER_N_JOBS

      - |
        find . -type f \( -name 'Makefile' -o -name 'Makefile.in' \) -exec \
          sed -i \
          's|/usr/lib/x86_64-linux-gnu/girepository-1.0|/app/lib/girepository-1.0|g' {} +

      - |
        mkdir -p /app/lib/girepository-1.0
        make install

    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/gtk-doc

    sources:
      - type: archive
        path: /home/ahmed/ply/flatpak/deps/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: vala
    buildsystem: autotools

    config-opts:
      - --prefix=/app
      - --libdir=/app/lib
      - --disable-unversioned
      - --disable-valadoc

    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install

      - |
        echo "=== Checking Vala installation ==="

        echo "--- Installed Vala tools ---"
        find /app -type f \( -name 'valac' -o -name 'vapigen' \) -ls || true

        echo "--- Build tools ---"
        ls -lh ./compiler/valac || true
        ls -lh ./vapigen/vapigen || true

        echo "--- /app/bin ---"
        ls -lah /app/bin || true

        if [ ! -x /app/bin/valac ]; then
          echo "valac was not installed by make install; installing manually..."
          mkdir -p /app/bin
          cp ./compiler/valac /app/bin/valac
          chmod +x /app/bin/valac
        fi

        if [ ! -x /app/bin/vapigen ]; then
          echo "vapigen was not installed by make install; installing manually..."
          mkdir -p /app/bin
          cp ./vapigen/vapigen /app/bin/vapigen
          chmod +x /app/bin/vapigen
        fi

        echo "--- Creating vapigen wrapper ---"

        mv /app/bin/vapigen /app/bin/vapigen-real

        cat > /app/bin/vapigen <<'EOF'
        #!/bin/sh
        set -e

        GIR=""

        for arg in "$@"; do
          case "$arg" in
            *.gir)
              GIR="$arg"
              ;;
          esac
        done

        if [ -n "$GIR" ] && [ -f "$GIR" ]; then
          echo "Cleaning unsupported doc:format from $GIR"
          sed -i '/<doc:format name="unknown"\/>/d' "$GIR"
        fi

        exec /app/bin/vapigen-real "$@"
        EOF

        chmod +x /app/bin/vapigen

        echo "--- Final tools ---"
        ls -lh /app/bin/valac
        ls -lh /app/bin/vapigen
        ls -lh /app/bin/vapigen-real

        echo "--- Versions ---"
        /app/bin/valac --version
        /app/bin/vapigen --version
        /app/bin/vapigen-real --version

    sources:
      - type: archive
        path: /home/ahmed/ply/flatpak/deps/vala-0.56.17.tar.xz
        sha256: 26100c4e4ef0049c619275f140d97cf565883d00c7543c82bcce5a426934ed6a
 
  - name: ayatana-ido
