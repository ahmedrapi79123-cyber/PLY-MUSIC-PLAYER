  # D-Bus Menu
  - name: libdbusmenu
    buildsystem: simple
    build-commands:
      # Fix old libdbusmenu configure.ac for modern Autoconf.
      - |
        python3 - <<'PY'
        p = "configure.ac"
        s = open(p).read()

        lines = [
            line for line in s.splitlines()
            if "AM_CONDITIONAL([HAVE_VALGRIND]" not in line
        ]
        s = "\n".join(lines) + "\n"

        marker = 'AS_IF([test "x$enable_tests" != "xno"],['

        if "have_valgrind=no" not in s:
            if marker not in s:
                raise SystemExit(
                    "ERROR: Could not find test AS_IF block"
                )

            s = s.replace(
                marker,
                "have_valgrind=no\n\n" + marker,
                1
            )

        needle = (
            'PKG_CHECK_MODULES(DBUSMENUTESTSVALGRIND, '
            'valgrind, have_valgrind=yes, have_valgrind=no)\n'
            '])'
        )

        replacement = (
            'PKG_CHECK_MODULES(DBUSMENUTESTSVALGRIND, '
            'valgrind, have_valgrind=yes, have_valgrind=no)\n'
            '])\n'
            'AM_CONDITIONAL([HAVE_VALGRIND], '
            '[test "x$have_valgrind" = "xyes"])'
        )

        if needle not in s:
            raise SystemExit(
                "ERROR: Could not find expected Valgrind block"
            )

        s = s.replace(needle, replacement, 1)

        open(p, "w").write(s)
        PY

      - autoreconf -fi

      - |
        ./configure \
          --prefix=/app \
          --disable-gtk-doc \
          --disable-tests \
          --disable-dumper

      # libdbusmenu uses deprecated GLib APIs.
      - |
        find . -type f \( -name 'Makefile' -o -name 'Makefile.in' \) \
          -exec sed -i 's/-Werror//g' {} +

      - make -j$FLATPAK_BUILDER_N_JOBS

      # Fix GObject Introspection typelib installation path.
      - |
        find . -type f \( -name 'Makefile' -o -name 'Makefile.in' \) \
          -exec sed -i \
          's|/usr/lib/x86_64-linux-gnu/girepository-1.0|/app/lib/girepository-1.0|g' {} +

        mkdir -p /app/lib/girepository-1.0

      - make install

    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a


